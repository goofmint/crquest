# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Minimal CodeRabbit configuration. Everything not listed here keeps its default.
reviews:
  path_filters:
    # Vendored third-party game content (unmodified copies of npm packages that
    # live in the repository, see docs/migration/content-layout.md). It consists
    # of thousands of files, which makes CodeRabbit skip the whole pull request
    # ("files exceed the limit of 300"), and it is not code written in this
    # repository. Code that consumes this content (src/, tasks/, tests) is still
    # reviewed.
    - "!public/content/**"
