<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TerminalQuest</title>
    <link rel="stylesheet" type="text/css" href="index.css" />
    <link rel="stylesheet" type="text/css" href="lib/loading.css" />
    <link rel="stylesheet" type="text/css" href="lib/tachyons.min.css" />
